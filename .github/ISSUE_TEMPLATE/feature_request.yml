name: Feature request · 功能建议
description: Suggest a target, an interaction, or an export improvement · 建议新增标定板、交互或导出改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the calibration workflow behind the request — which
        detector consumes the board, and what it expects. That detail decides
        whether and how the feature can be built.
        请说明需求背后的标定流程：由哪个识别器使用该标定板、它对图案有什么要求。这些细节决定了功能能否实现以及如何实现。
  - type: textarea
    id: problem
    attributes:
      label: Problem · 要解决的问题
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour · 期望的行为
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of request · 建议类型
      options:
        - New calibration target · 新增标定板
        - Change to an existing target · 修改现有标定板
        - Canvas or editing interaction · 画布或编辑交互
        - Export or print · 导出或打印
        - Interface and language · 界面与语言
        - Other · 其他
    validations:
      required: true
  - type: input
    id: detector
    attributes:
      label: Detector or reference · 识别器或参考资料
      description: OpenCV / AprilTag / Kalibr / other, with a link to the convention if you have one.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives · 备选方案
      description: Any workaround you use today.
    validations:
      required: false
